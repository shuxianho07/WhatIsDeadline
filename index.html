<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>what do you mean there is a test tomorrow?</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Flatpickr Calendar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Login Screen -->
    <div id="login-wrapper" class="app-container" style="justify-content: center; align-items: center; min-height: 100vh;">
        <div class="glass-panel" style="width: 100%; max-width: 400px; text-align: center;">
            <h1 style="font-size: 2rem; margin-bottom: 2rem;"><i class="fa-solid fa-brain"></i> Welcome</h1>
            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" required placeholder="admin or guest">
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
                    <label for="login-password">Password (if admin)</label>
                    <input type="password" id="login-password" placeholder="••••••">
                </div>
                <div id="login-error" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;">Invalid credentials</div>
                <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
                <button type="button" id="btn-register" class="btn-secondary" style="width: 100%; justify-content: center; margin-top: 0.5rem; color: var(--accent-primary); border-color: var(--accent-primary);">Register New Account</button>
                <button type="button" class="btn-secondary" id="btn-guest" style="width: 100%; justify-content: center; margin-top: 0.5rem;">Continue as Guest</button>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>

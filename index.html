<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>what do you mean there is a test tomorrow?</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Flatpickr Calendar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Login Screen -->
    <div id="login-wrapper" class="app-container" style="justify-content: center; align-items: center; min-height: 100vh;">
        <div class="glass-panel" style="width: 100%; max-width: 400px; text-align: center;">
            <h1 style="font-size: 2rem; margin-bottom: 2rem;"><i class="fa-solid fa-brain"></i> Welcome</h1>
            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" required placeholder="admin or guest">
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••">
                </div>
                <div id="login-error" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;">Invalid credentials</div>
                <div style="text-align: right; margin-bottom: 1rem;">
                    <a href="#" id="show-forgot" style="color: var(--text-secondary); font-size: 0.85rem;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
                <div style="margin-top: 1rem; font-size: 0.95rem;">
                    Don't have an account? <a href="#" id="show-register" style="color: var(--accent-primary); font-weight: 600;">Register here</a>
                </div>
                <button type="button" class="btn-secondary" id="btn-guest" style="width: 100%; justify-content: center; margin-top: 1rem;">Continue as Guest</button>
            </form>

            <form id="register-form" style="display: none;">
                <div class="form-group" style="text-align: left;">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="you@example.com">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" required placeholder="Choose a username">
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required placeholder="••••••">
                </div>
                <div id="reg-error" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;">Error</div>
                <button type="submit" class="btn-primary" style="width: 100%;">Create Account</button>
                <div style="margin-top: 1rem; font-size: 0.95rem;">
                    Already have an account? <a href="#" id="show-login" style="color: var(--accent-primary); font-weight: 600;">Login here</a>
                </div>
            </form>

            <form id="forgot-form" style="display: none;">
                <h2 style="font-size: 1.25rem; margin-bottom: 1rem; color: var(--text-primary);">Reset Password</h2>
                <div class="form-group" style="text-align: left;">
                    <label for="forgot-email">Email Address</label>
                    <input type="email" id="forgot-email" required placeholder="you@example.com">
                </div>
                <div id="forgot-error" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;">Error</div>
                <button type="submit" class="btn-primary" style="width: 100%;">Send Recovery Email</button>
                <div style="margin-top: 1rem; font-size: 0.95rem;">
                    <a href="#" id="show-login-from-forgot" style="color: var(--accent-primary); font-weight: 600;">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>

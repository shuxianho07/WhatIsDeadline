<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>what do you mean there is a test tomorrow? - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="reset-wrapper" class="app-container" style="justify-content: center; align-items: center; min-height: 100vh; display: flex;">
        <div class="glass-panel" style="width: 100%; max-width: 400px; text-align: center;">
            <h1 style="font-size: 1.5rem; margin-bottom: 2rem;"><i class="fa-solid fa-key"></i> Set New Password</h1>
            
            <form id="reset-form">
                <div class="form-group" style="text-align: left;">
                    <label for="reset-username">Username</label>
                    <input type="text" id="reset-username" required placeholder="Your username">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label for="reset-temp">Temporary Password</label>
                    <input type="text" id="reset-temp" required placeholder="From the email">
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
                    <label for="reset-new">New Password</label>
                    <input type="password" id="reset-new" required placeholder="••••••">
                </div>
                <div id="reset-error" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;">Error</div>
                <button type="submit" class="btn-primary" style="width: 100%;">Update Password</button>
                <div style="margin-top: 1rem; font-size: 0.95rem;">
                    <a href="index.html" style="color: var(--accent-primary); font-weight: 600;">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="reset.js"></script>
</body>
</html>
